---
- name: Build kolla-ansible image
  hosts: all
  vars:
    python_venv_dir: /tmp/venv

  environment:
    openstack_version: "{{ version_openstack | default('master') }}"
    registry: "{{ docker_registry | default('osism.harbor.regio.digital') }}"
    repository: "{{ docker_namespace | default('osism') }}/kolla-ansible"
    version: "{{ zuul['tag'] | default('latest') }}"
    COSIGN_PASSWORD: "{{ secret.COSIGN_PASSWORD | default('') }}"
    COSIGN_PRIVATE_KEY: "{{ secret.COSIGN_PRIVATE_KEY | default('') }}"
    DTRACK_SERVER: "https://dtrack.osism.tech"
    DTRACK_API_KEY: "{{ secret.DTRACK_API_KEY | default('') }}"

  tasks:
    - name: Log into registry
      community.docker.docker_login:
        registry_url: "{{ docker_registry }}"
        username: "{{ secret.DOCKER_USERNAME }}"
        password: "{{ secret.DOCKER_PASSWORD }}"
      when: push_image | default(false) | bool
      no_log: true

    - name: Run build script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          revision=$(git rev-parse --short HEAD)
          revision_full=$(git rev-parse HEAD)

          # NOTE: The sources that are fetched while the image is built are
          #       resolved to commits here, so that the image records what it
          #       contains and not only the commit of this repository. The
          #       commits are passed into the build as well, which pins them:
          #       without that the label and the clone in the Containerfile are
          #       two independent resolutions of a floating ref and can differ.
          resolve_commit () {
              local url=$1
              local ref=$2
              local refs sha

              # NOTE: An annotated tag resolves to the tag object and not to
              #       a commit, so the commit is requested explicitly as
              #       $ref^{}. That pattern matches nothing for a branch or a
              #       lightweight tag, where $ref is the commit itself.
              refs=$(git ls-remote "$url" "$ref" "$ref^{}")

              sha=$(echo "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')
              if [[ -z $sha ]]; then
                  sha=$(echo "$refs" | awk 'NR == 1 { print $1 }')
              fi

              if [[ -z $sha ]]; then
                  echo "unable to resolve $ref in $url" >&2
                  exit 1
              fi

              echo "$sha"
          }

          release_version () {
              echo "$base_yml" | grep "^$1:" | awk -F': ' '{ print $2 }' | tr -d "\"' "
          }

          # NOTE: For builds for a specific release, the release tag is
          #       resolved to a commit first and every file of the release
          #       repository is read through that commit, so a tag moved
          #       during the build cannot mix two states. The OpenStack
          #       version is taken from it.
          sbom_args=()
          if [[ $version != "latest" ]]; then
              sha_release=$(resolve_commit https://github.com/osism/release "refs/tags/kolla-ansible-$version")
              release_url=https://raw.githubusercontent.com/osism/release/$sha_release/latest
              filename=$(curl -fsSL "$release_url/openstack.yml")
              openstack_version=$(curl -fsSL "$release_url/$filename" | grep "openstack_version:" | awk -F': ' '{ print $2 }' | tr -d '"')
              base_yml=$(curl -fsSL "$release_url/base.yml")

              # NOTE: next/ is an override added after tagging, so it is read
              #       from main and not from the release commit.
              next_file_url="https://raw.githubusercontent.com/osism/release/main/next/kolla-ansible-$version.yml"
              if curl -f -s "$next_file_url" >/dev/null 2>&1; then
                  # File exists, extract openstack_sbom value
                  sbom_version=$(curl -fsSL "$next_file_url" | grep "openstack_sbom:" | awk -F': ' '{ print $2 }' | tr -d '"' | tr -d ' ')
              else
                  # File doesn't exist, use the same version
                  {% raw %}
                  sbom_version="${version:1:${#version}-1}"
                  {% endraw %}
              fi

              # NOTE: The SBOM is resolved to a digest once and fetched by it,
              #       so the label names the SBOM the image contains even if
              #       its version is pushed again meanwhile.
              sbom_repository=$registry/kolla/release/$openstack_version/sbom
              sbom_digest=sha256:$(docker buildx imagetools inspect --raw "$sbom_repository:$sbom_version" | sha256sum | cut -d' ' -f1)
              docker create --name sbom "$sbom_repository@$sbom_digest" nologin
              docker cp sbom:/images.yml files/sbom.yml
              docker rm sbom
              sbom_args=(
                  --label "de.osism.sbom=$sbom_version"
                  --label "de.osism.sbom.digest=$sbom_digest"
              )
          fi

          . defaults/${openstack_version}.sh

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          # NOTE: Mirrors the clone in the Containerfile.
          case $openstack_version in
              master)
                  kolla_ansible_ref=refs/heads/master
                  ;;
              2024.2)
                  kolla_ansible_ref=refs/tags/2024.2-eol
                  ;;
              *)
                  kolla_ansible_ref=refs/heads/stable/$openstack_version
                  ;;
          esac

          sha_kolla_ansible=$(resolve_commit https://github.com/openstack/kolla-ansible "$kolla_ansible_ref")

          # kolla-operations is only read where kolla-operations.patch applies;
          # it is retired from 2025.1 on
          case "$openstack_version" in
              2023.2|2024.1|2024.2) kolla_operations=true ;;
              *) kolla_operations=false ;;
          esac
          operations_args=()

          # NOTE: For a release build the OSISM sources are pinned by tags in the
          #       release repository. For a latest build -- which is what
          #       development and test deployments use -- they float on their
          #       default branches, which is the case that needs this most.
          if [[ $version != "latest" ]]; then
              sha_ansible_playbooks=$(resolve_commit https://github.com/osism/ansible-playbooks "refs/tags/$(release_version playbooks_version)")
              sha_generics=$(resolve_commit https://github.com/osism/generics "refs/tags/$(release_version generics_version)")
              if [[ $kolla_operations == true ]]; then
                  sha_kolla_operations=$(resolve_commit https://github.com/osism/kolla-operations "refs/tags/$(release_version operations_version)")
              fi
          else
              sha_release=$(resolve_commit https://github.com/osism/release HEAD)
              sha_ansible_playbooks=$(resolve_commit https://github.com/osism/ansible-playbooks HEAD)
              sha_generics=$(resolve_commit https://github.com/osism/generics HEAD)
              if [[ $kolla_operations == true ]]; then
                  sha_kolla_operations=$(resolve_commit https://github.com/osism/kolla-operations HEAD)
              fi
          fi

          if [[ $kolla_operations == true ]]; then
              operations_args=(
                  --build-arg "SHA_KOLLA_OPERATIONS=$sha_kolla_operations"
                  --label "de.osism.commit.kolla_operations=$sha_kolla_operations"
              )
          fi

          # NOTE: The base image is pinned by digest the same way.
          base_image=$(awk -F= '$1 == "ARG BASE_IMAGE" { print $2; exit }' Containerfile)
          base_tag=$(awk -F= '$1 == "ARG BASE_TAG" { print $2; exit }' Containerfile)
          if [[ -z $base_image || -z $base_tag ]]; then
              echo "no ARG BASE_IMAGE or BASE_TAG in the Containerfile" >&2
              exit 1
          fi
          base_name=$base_image:$base_tag
          base_digest=sha256:$(docker buildx imagetools inspect --raw "$base_name" | sha256sum | cut -d' ' -f1)

          docker buildx build \
              "${operations_args[@]}" \
              "${sbom_args[@]}" \
              --build-arg "BASE_TAG=$base_tag@$base_digest" \
              --build-arg "OPENSTACK_VERSION=$openstack_version" \
              --build-arg "SHA_ANSIBLE_PLAYBOOKS=$sha_ansible_playbooks" \
              --build-arg "SHA_GENERICS=$sha_generics" \
              --build-arg "SHA_KOLLA_ANSIBLE=$sha_kolla_ansible" \
              --build-arg "SHA_RELEASE=$sha_release" \
              --build-arg "VERSION=$version" \
              --label "org.opencontainers.image.base.digest=$base_digest" \
              --label "org.opencontainers.image.base.name=$base_name" \
              --label "org.opencontainers.image.created=$created" \
              --label "org.opencontainers.image.documentation=https://osism.tech/docs/" \
              --label "org.opencontainers.image.licenses=ASL 2.0" \
              --label "org.opencontainers.image.revision=$revision_full" \
              --label "org.opencontainers.image.source=https://github.com/osism/container-image-kolla-ansible" \
              --label "org.opencontainers.image.title=kolla-ansible" \
              --label "org.opencontainers.image.url=https://quay.io/organization/osism" \
              --label "org.opencontainers.image.vendor=OSISM GmbH" \
              --label "org.opencontainers.image.version=$version" \
              --label "de.osism.commit.ansible_playbooks=$sha_ansible_playbooks" \
              --label "de.osism.commit.generics=$sha_generics" \
              --label "de.osism.commit.kolla_ansible=$sha_kolla_ansible" \
              --label "de.osism.commit.release=$sha_release" \
              --label "de.osism.release.openstack=$openstack_version" \
              --load \
              --tag "$revision" \
              .  # <-- there is a dot
      changed_when: true

    - name: Run push script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          revision=$(git rev-parse --short HEAD)

          # NOTE: For builds for a specific release, the OpenStack version is taken from the release repository.
          if [[ $version != "latest" ]]; then
              filename=$(curl -L https://raw.githubusercontent.com/osism/release/kolla-ansible-$version/latest/openstack.yml)
              openstack_version=$(curl -L https://raw.githubusercontent.com/osism/release/kolla-ansible-$version/latest/$filename | grep "openstack_version:" | awk -F': ' '{ print $2 }' | tr -d '"')
          fi

          . defaults/${openstack_version}.sh

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          {% raw %}
          if [[ $version != "latest" ]]; then
              version="${version:1:${#version}-1}"
          fi
          {% endraw %}

          if [[ $openstack_version == "master" ]]; then
              tag=$repository:latest

              docker tag "$revision" "$tag"
              docker push "$tag"
          else
              if [[ $version == "latest" ]]; then
                  tag=$repository:$openstack_version
              else
                  tag=$repository:$version
              fi

              docker tag "$revision" "$tag"
              docker push "$tag"
          fi
      when: push_image | default(false) | bool
      changed_when: false
      environment:
        OPENSTACK_VERSION: "{{ version_openstack | default('master') }}"
        REGISTRY: "{{ docker_registry }}"
        REPOSITORY: "{{ docker_namespace }}/kolla-ansible"
        VERSION: latest

    - name: Run cosign script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          if [[ $version == "latest" ]]; then
              version=$openstack_version
          else
              {% raw %}
              version="${version:1:${#version}-1}"
              {% endraw %}
          fi

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
          chmod +x cosign-linux-amd64
          ./cosign-linux-amd64 sign --yes --key env://COSIGN_PRIVATE_KEY "$repository:$version"
      when: push_sbom | default(false) | bool
      changed_when: true

    - name: Run sbom script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir | default('.') }}"
        cmd: |
          set -e
          set -o pipefail
          set -x

          if [[ $version == "latest" ]]; then
              version=$openstack_version
          else
              {% raw %}
              version="${version:1:${#version}-1}"
              {% endraw %}
          fi

          if [[ -n $registry ]]; then
              repository="$registry/$repository"
          fi

          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          /usr/local/bin/syft scan "$repository:$version" -o cyclonedx-json@1.6 > sbom.json
          {{ python_venv_dir }}/bin/dtrackauditor \
            -p kolla-ansible \
            -v "$version" \
            -f sbom.json \
            -a
      when: push_sbom | default(false) | bool
      changed_when: true
